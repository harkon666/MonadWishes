[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Monad Testnet RPC Configuration
[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
